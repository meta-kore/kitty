<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty - AI treasurer for savings circles</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e4e0d6; --brand:#0b5fff; --brand-ink:#fff;
          --ok:#12805c; --ok-bg:#e3f5ee; --warn:#a15c00; --warn-bg:#fdf0d8; --bad:#b42318; --ai:#5b3fd6; --ai-bg:#f0ecff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { background:#10203f; color:#fff; padding:20px 16px; }
  header .in, main { max-width:1040px; margin:0 auto; }
  header h1 { margin:0; font-size:26px; letter-spacing:-.02em; }
  header p { margin:4px 0 0; color:#c5d0e6; max-width:70ch; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:#ffffff22; margin-left:8px; vertical-align:middle; }
  main { padding:20px 16px 60px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  h2 { margin:0 0 10px; font-size:18px; }
  .muted { color:var(--muted); font-size:14px; }
  .grid2 { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start; }
  @media (max-width:820px){ .grid2{ grid-template-columns:1fr; } }
  button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 14px; border-radius:9px; cursor:pointer; }
  button.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); font-weight:600; }
  button.ai { background:var(--ai); color:#fff; border-color:var(--ai); font-weight:600; }
  button.small { padding:4px 10px; font-size:13px; }
  button:disabled { opacity:.5; cursor:wait; }
  input, textarea { font:inherit; width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); }
  label { font-size:13px; color:var(--muted); display:block; margin:8px 0 3px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .row > * { flex:1; min-width:140px; }
  .row.tight > * { flex:none; min-width:0; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .tablewrap { overflow-x:auto; }
  .chip { display:inline-block; font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px; white-space:nowrap; }
  .chip.ok { background:var(--ok-bg); color:var(--ok); } .chip.warn { background:var(--warn-bg); color:var(--warn); }
  .bar { height:12px; background:#ece8dd; border-radius:99px; overflow:hidden; margin:10px 0 4px; }
  .bar i { display:block; height:100%; background:var(--ok); transition:width .4s; }
  .big { font-size:30px; font-weight:700; letter-spacing:-.02em; }
  .action { border:1px solid #d9d0ff; background:var(--ai-bg); border-radius:12px; padding:12px; margin-top:10px; }
  .action h3 { margin:0 0 4px; font-size:15px; }
  .action textarea { min-height:96px; margin-top:6px; }
  .how { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:720px){ .how{ grid-template-columns:1fr; } }
  .how div { background:#faf8f3; border:1px solid var(--line); border-radius:12px; padding:12px; font-size:14px; }
  .how b { display:block; font-size:15px; margin-bottom:2px; }
  .err { background:#fde8e6; color:var(--bad); border:1px solid #f5c2bd; padding:10px 12px; border-radius:10px; display:none; }
  .answer { white-space:pre-wrap; background:var(--ai-bg); border-radius:10px; padding:10px 12px; margin-top:10px; display:none; }
  a { color:var(--brand); }
  .summary { white-space:pre-wrap; font-size:14px; color:#344054; }
</style>
</head>
<body>
<header><div class="in">
  <h1>Kitty <span class="pill" id="mode"></span></h1>
  <p>The AI treasurer for savings circles. Friends each pay in the same amount every cycle, and one member takes home the whole pot. Kitty collects through PayPal, chases politely, and pays the pot out.</p>
</div></header>
<main>
  <div class="err" id="err"></div>
  <div id="app"></div>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let S = null, plan = null, answer = '';

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function showErr(m) { const e = $('#err'); e.textContent = m || ''; e.style.display = m ? 'block' : 'none'; }
async function run(btn, fn) {
  showErr(''); const label = btn?.textContent; if (btn) { btn.disabled = true; btn.textContent = 'Working...'; }
  try { await fn(); } catch (e) { showErr(e.message); }
  if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; }
  await load();
}
async function load() { S = await api('GET', '/api/state'); render(); }
const fmt = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: S.circle?.currency || 'USD' }).format(n);
const member = (id) => S.circle.members.find((m) => m.id === id);

function render() {
  $('#mode').textContent = S.mock ? 'offline mock' : 'PayPal sandbox';
  $('#app').innerHTML = S.circle ? viewCircle() : viewSetup();
}

function viewSetup() {
  const rows = [['Amina Otieno', 5, 0], ['Carlos Mendez', 4, 1], ['Priya Nair', 1, 4], ['Kwame Boateng', 5, 0]]
    .map(([n, a, b], i) => `<div class="row"><input class="m-name" value="${n}" aria-label="Member name"><input class="m-email" placeholder="PayPal sandbox email ${i + 1}" aria-label="Member email"><input class="m-on" type="hidden" value="${a}"><input class="m-late" type="hidden" value="${b}"></div>`).join('<div style="height:8px"></div>');
  return `
  <div class="card"><h2>How a savings circle works</h2>
    <div class="how">
      <div><b>1. Everyone pays in</b>Each cycle, every member contributes the same amount. Kitty sends each one a PayPal invoice.</div>
      <div><b>2. Kitty keeps it on track</b>The AI reads who has paid, writes reminders in a tone that fits each member's history, and answers the treasurer's questions.</div>
      <div><b>3. One member gets the pot</b>When everyone has paid, the treasurer approves and PayPal pays the whole pot to that cycle's recipient. Next cycle, it is someone else's turn.</div>
    </div>
    <p class="muted" style="margin-bottom:0">Known as a chama in Kenya, tanda in Mexico, susu in West Africa and the Caribbean, hui in China and chit fund in India.</p>
  </div>
  <div class="card"><h2>Create a circle</h2>
    <div class="row"><div><label>Circle name</label><input id="c-name" value="Sunday Savers"></div>
      <div><label>Contribution per member, per cycle (USD)</label><input id="c-amt" type="number" min="1" value="100"></div></div>
    <label>Members, in payout order (use the email addresses of your PayPal sandbox personal accounts)</label>
    <div id="members">${rows}</div>
    <p class="muted">The demo members come with a payment history, so you can see the AI adjust its tone.</p>
    <button class="primary" onclick="createCircle(this)">Create circle</button>
  </div>`;
}

function viewCircle() {
  const c = S.circle, cy = c.cycles[c.cycles.length - 1];
  const collecting = cy && cy.status === 'collecting';
  const pot = c.contribution * c.members.length;
  let top;
  if (!cy || !collecting) {
    const next = c.members[c.cycles.length % c.members.length];
    top = `<div class="card"><h2>${esc(c.name)}</h2>
      <p>${c.members.length} members, ${fmt(c.contribution)} each per cycle, pot of ${fmt(pot)}.</p>
      <p>Next pot goes to <b>${esc(next.name)}</b>.</p>
      <button class="primary" onclick="run(this, () => api('POST','/api/cycles/start'))">Start cycle ${c.cycles.length + 1} and send PayPal invoices</button></div>`;
  } else {
    const paid = cy.contributions.filter((x) => x.status !== 'SENT').length;
    const rows = cy.contributions.map((x) => { const m = member(x.memberId); const done = x.status !== 'SENT'; return `<tr>
      <td><b>${esc(m.name)}</b>${x.memberId === cy.recipientId ? ' <span class="chip ok">gets the pot</span>' : ''}<div class="muted">${m.onTime} on time, ${m.late} late</div></td>
      <td>${done ? `<span class="chip ok">${x.status === 'CASH' ? 'Paid in cash' : 'Paid via PayPal'}</span>` : `<span class="chip warn">Unpaid</span>${x.reminders.length ? `<div class="muted">${x.reminders.length} reminder${x.reminders.length > 1 ? 's' : ''} sent</div>` : ''}`}</td>
      <td>${x.payUrl ? `<a href="${esc(x.payUrl)}" target="_blank" rel="noopener">Invoice ${esc(x.number)}</a>` : esc(x.number)}</td>
      <td>${done ? '' : `<button class="small" onclick="run(this, () => api('POST','/api/cycles/cash/${x.memberId}'))">Record cash</button>`}</td></tr>`; }).join('');
    top = `<div class="grid2">
      <div class="card"><div class="row tight" style="justify-content:space-between"><h2 style="margin:0">${esc(c.name)}: cycle ${cy.n}</h2>
        <button class="small" onclick="run(this, () => api('POST','/api/cycles/sync'))">Refresh from PayPal</button></div>
        <div class="tablewrap"><table><thead><tr><th>Member</th><th>Status</th><th>PayPal invoice</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
        ${cy.contributions.length < c.members.length ? `<p class="muted" style="color:var(--warn)">Only ${cy.contributions.length} of ${c.members.length} invoices were sent. The pot cannot be paid out until every member has one.</p>
        <button class="primary small" onclick="run(this, () => api('POST','/api/cycles/start'))">Send the remaining invoices</button>` : ''}</div>
      <div class="card"><div class="muted">Pot for ${esc(member(cy.recipientId).name)}</div>
        <div class="big">${fmt(paid * c.contribution)} <span class="muted">of ${fmt(pot)}</span></div>
        <div class="bar"><i style="width:${(paid / c.members.length) * 100}%"></i></div>
        <div class="muted">${paid} of ${c.members.length} members have paid</div>
        ${cy.failedPayouts?.length ? `<p class="muted" style="color:var(--bad)">PayPal did not complete the last payout (batch ${esc(cy.failedPayouts[cy.failedPayouts.length - 1].batchId)}: ${esc(cy.failedPayouts[cy.failedPayouts.length - 1].status)}). No money moved. Ask Kitty to try again.</p>` : ''}
        <div style="height:14px"></div>
        <button class="ai" style="width:100%" onclick="runAgent(this)">Ask Kitty what to do next</button>
        <div id="plan">${viewPlan()}</div></div>
    </div>`;
  }
  const history = c.cycles.filter((x) => x.status === 'paid_out').reverse().map((x) => `<div style="padding:10px 0;border-top:1px solid var(--line)">
      <b>Cycle ${x.n}</b>: ${fmt(x.payout.amount)} paid to ${esc(member(x.recipientId).name)} <span class="chip ok">PayPal payout ${esc(x.payout.status)}</span>
      <div class="muted">Batch ${esc(x.payout.batchId)}</div><div class="summary">${esc(x.summary || '')}</div></div>`).join('');
  return top + `
    <div class="card"><h2>Ask Kitty</h2>
      <div class="row"><input id="q" placeholder="Who still owes this cycle? Who has been most reliable?" onkeydown="if(event.key==='Enter')ask($('#askb'))" style="flex:4"><button id="askb" class="ai" style="flex:none" onclick="ask(this)">Ask</button></div>
      <div class="answer" id="answer" style="display:${answer ? 'block' : 'none'}">${esc(answer)}</div></div>
    <div class="card"><div class="row tight" style="justify-content:space-between"><h2 style="margin:0">Payout history</h2>
      <button class="small" onclick="run(this, () => api('POST','/api/payout/refresh'))">Refresh payout status</button></div>
      ${history || '<p class="muted">No pots paid out yet.</p>'}</div>
    <p class="muted"><a href="#" onclick="if(confirm('Delete this circle and start again?'))run(null, () => api('DELETE','/api/circle'));return false">Reset demo</a> &middot; AI: ${esc(S.ai.provider)} / ${esc(S.ai.model)}</p>`;
}

function viewPlan() {
  if (!plan) return '<p class="muted">Kitty reviews who has paid and proposes reminders or the payout. Nothing is sent until you approve it.</p>';
  const acts = plan.actions.map((a, i) => a.type === 'remind' ? `<div class="action"><h3>Remind ${esc(member(a.memberId)?.name)} <span class="chip warn">${esc(a.tone || 'gentle')}</span></h3>
      <div class="muted">${esc(a.reason)}</div>
      <input id="sub${i}" value="${esc(a.subject)}" aria-label="Subject" style="margin-top:6px"><textarea id="note${i}" aria-label="Message">${esc(a.note)}</textarea>
      <div class="row tight" style="margin-top:8px"><button class="primary small" onclick="approveRemind(this, ${i})">Approve and send via PayPal</button><button class="small" onclick="dismiss(${i})">Dismiss</button></div></div>`
    : `<div class="action"><h3>Pay out the pot</h3><div class="muted">${esc(a.reason)}</div>
      <div class="row tight" style="margin-top:8px"><button class="primary small" onclick="approvePayout(this)">Approve PayPal payout</button><button class="small" onclick="dismiss(${i})">Dismiss</button></div></div>`).join('');
  return `<p style="margin:12px 0 0">${esc(plan.briefing)}</p>${acts || '<p class="muted">Nothing to do right now.</p>'}`;
}

async function createCircle(btn) {
  const members = [...document.querySelectorAll('#members .row')].map((r) => ({ name: $('.m-name', r).value.trim(), email: $('.m-email', r).value.trim(), onTime: $('.m-on', r).value, late: $('.m-late', r).value })).filter((m) => m.name || m.email);
  await run(btn, () => api('POST', '/api/circle', { name: $('#c-name').value.trim(), contribution: Number($('#c-amt').value), members }));
}
async function runAgent(btn) { await run(btn, async () => { plan = null; plan = await api('POST', '/api/agent/run'); }); }
async function approveRemind(btn, i) { const a = plan.actions[i]; await run(btn, async () => { await api('POST', '/api/actions/remind', { memberId: a.memberId, subject: $('#sub' + i).value, note: $('#note' + i).value }); plan.actions.splice(i, 1); }); }
async function approvePayout(btn) { await run(btn, async () => { await api('POST', '/api/actions/payout'); plan = null; }); }
function dismiss(i) { plan.actions.splice(i, 1); render(); }
async function ask(btn) { const question = $('#q').value; await run(btn, async () => { answer = (await api('POST', '/api/ask', { question })).answer; }); }
load().catch((e) => showErr(e.message));
</script>
</body>
</html>

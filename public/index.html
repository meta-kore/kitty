<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty - AI treasurer for savings circles</title>
<!-- Bryntum Scheduler (trial), served from node_modules by src/server.ts: structural CSS, one theme, and its icon font. -->
<link rel="stylesheet" href="/vendor/bryntum/scheduler.css">
<link rel="stylesheet" href="/vendor/bryntum/svalbard-light.css">
<link rel="stylesheet" href="/vendor/bryntum/fontawesome/css/fontawesome.css">
<link rel="stylesheet" href="/vendor/bryntum/fontawesome/css/solid.css">
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e4e0d6; --brand:#0b5fff; --brand-ink:#fff;
          --ok:#12805c; --ok-bg:#e3f5ee; --warn:#a15c00; --warn-bg:#fdf0d8; --bad:#b42318; --ai:#5b3fd6; --ai-bg:#f0ecff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { background:#10203f; color:#fff; padding:20px 16px; }
  header .in, main { max-width:1040px; margin:0 auto; }
  header h1 { margin:0; font-size:26px; letter-spacing:-.02em; }
  header p { margin:4px 0 0; color:#c5d0e6; max-width:70ch; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:#ffffff22; margin-left:8px; vertical-align:middle; }
  main { padding:20px 16px 60px; display:grid; gap:16px; grid-template-columns:minmax(0,1fr); }
  #app { display:grid; gap:16px; grid-template-columns:minmax(0,1fr); }
  #sched { width:100%; max-width:100%; overflow:hidden; border:1px solid var(--line); border-radius:10px; }
  #sched .k-link { cursor:pointer; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:13px; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  h2 { margin:0 0 10px; font-size:18px; }
  .muted { color:var(--muted); font-size:14px; }
  .grid2 { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start; }
  @media (max-width:820px){ .grid2{ grid-template-columns:1fr; } }
  button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 14px; border-radius:9px; cursor:pointer; }
  button.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); font-weight:600; }
  button.ai { background:var(--ai); color:#fff; border-color:var(--ai); font-weight:600; }
  button.small { padding:4px 10px; font-size:13px; }
  button:disabled { opacity:.5; cursor:wait; }
  input, textarea, select { font:inherit; width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); }
  label { font-size:13px; color:var(--muted); display:block; margin:8px 0 3px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .row > * { flex:1; min-width:140px; }
  .row.tight > * { flex:none; min-width:0; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .tablewrap { overflow-x:auto; }
  .chip { display:inline-block; font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px; white-space:nowrap; }
  .chip.ok { background:var(--ok-bg); color:var(--ok); } .chip.warn { background:var(--warn-bg); color:var(--warn); }
  .bar { height:12px; background:#ece8dd; border-radius:99px; overflow:hidden; margin:10px 0 4px; }
  .bar i { display:block; height:100%; background:var(--ok); transition:width .4s; }
  .big { font-size:30px; font-weight:700; letter-spacing:-.02em; }
  .action { border:1px solid #d9d0ff; background:var(--ai-bg); border-radius:12px; padding:12px; margin-top:10px; }
  .action h3 { margin:0 0 4px; font-size:15px; }
  .action textarea { min-height:96px; margin-top:6px; }
  .how { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:720px){ .how{ grid-template-columns:1fr; } }
  .how div { background:#faf8f3; border:1px solid var(--line); border-radius:12px; padding:12px; font-size:14px; }
  .how b { display:block; font-size:15px; margin-bottom:2px; }
  .err { background:#fde8e6; color:var(--bad); border:1px solid #f5c2bd; padding:10px 12px; border-radius:10px; display:none; }
  .answer { white-space:pre-wrap; background:var(--ai-bg); border-radius:10px; padding:10px 12px; margin-top:10px; display:none; }
  a { color:var(--brand); }
  .summary { white-space:pre-wrap; font-size:14px; color:#344054; }
</style>
</head>
<body>
<header><div class="in">
  <h1>Kitty <span class="pill" id="mode"></span></h1>
  <p>The AI treasurer for savings circles. Friends each pay in the same amount every cycle, and one member takes home the whole pot. Kitty collects through PayPal, chases politely, and pays the pot out.</p>
</div></header>
<main>
  <div class="err" id="err"></div>
  <div id="app"></div>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let S = null, plan = null, answer = '';

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function showErr(m) { const e = $('#err'); e.textContent = m || ''; e.style.display = m ? 'block' : 'none'; }
async function run(btn, fn) {
  showErr(''); const label = btn?.textContent; if (btn) { btn.disabled = true; btn.textContent = 'Working...'; }
  try { await fn(); } catch (e) { showErr(e.message); }
  if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; }
  await load();
}
async function load() { S = await api('GET', '/api/state'); render(); }
const fmt = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: S.circle?.currency || 'USD' }).format(n);
const member = (id) => S.circle.members.find((m) => m.id === id);

function render() {
  $('#mode').textContent = S.mock ? 'offline mock' : 'PayPal sandbox';
  $('#app').innerHTML = S.circle ? viewCircle() : viewSetup();
  window.mountSchedule?.(); // the Bryntum panel, defined in the module script at the end of the page
}
const SCHED = { PAID: '#12805c', CASH: '#0e7490', SENT: '#b45309', upcoming: '#98a2b3', pot: '#5b3fd6' };
function scheduleCard() {
  if (!S.schedule) return '';
  const key = (c, t) => `<span><i style="background:${c}"></i>${t}</span>`;
  return `<div class="card"><h2>Rotation schedule${S.schedule.rotation > 1 ? `: rotation ${S.schedule.rotation}` : ''}</h2>
    <p class="muted" style="margin-top:0">Who pays and who receives the pot in each ${S.schedule.cycleDays}-day cycle. Drag a future "receives the pot" turn along its row to move it to another cycle, or up or down to give that turn to another member.</p>
    <div id="sched"></div>
    <div class="legend">${key(SCHED.PAID, 'Paid via PayPal')}${key(SCHED.CASH, 'Paid in cash')}${key(SCHED.SENT, 'Unpaid (click to open the invoice)')}${key(SCHED.upcoming, 'Upcoming')}${key(SCHED.pot, 'Receives the pot')}</div></div>`;
}

function viewSetup() {
  const rows = [['Amina Otieno', 5, 0], ['Carlos Mendez', 4, 1], ['Priya Nair', 1, 4], ['Kwame Boateng', 5, 0]]
    .map(([n, a, b], i) => `<div class="row"><input class="m-name" value="${n}" aria-label="Member name"><input class="m-email" placeholder="PayPal sandbox email ${i + 1}" aria-label="Member email"><input class="m-on" type="hidden" value="${a}"><input class="m-late" type="hidden" value="${b}"></div>`).join('<div style="height:8px"></div>');
  return `
  <div class="card"><h2>How a savings circle works</h2>
    <div class="how">
      <div><b>1. Everyone pays in</b>Each cycle, every member contributes the same amount. Kitty sends each one a PayPal invoice.</div>
      <div><b>2. Kitty keeps it on track</b>The AI reads who has paid, writes reminders in a tone that fits each member's history, and answers the treasurer's questions.</div>
      <div><b>3. One member gets the pot</b>When everyone has paid, the treasurer approves and PayPal pays the whole pot to that cycle's recipient. Next cycle, it is someone else's turn.</div>
    </div>
    <p class="muted" style="margin-bottom:0">Known as a chama in Kenya, tanda in Mexico, susu in West Africa and the Caribbean, hui in China and chit fund in India.</p>
  </div>
  <div class="card"><h2>Create a circle</h2>
    <div class="row"><div><label>Circle name</label><input id="c-name" value="Sunday Savers"></div>
      <div><label>Contribution per member, per cycle (USD)</label><input id="c-amt" type="number" min="1" value="100"></div></div>
    <div class="row"><div><label>Group type</label><select id="c-type">
        <option value="rosca">Rotating pot: one member takes the whole pot each cycle</option>
        <option value="table">Table banking: members save, borrow from the fund, then share it out</option></select></div>
      <div><label>Table banking only: meetings before the share-out</label><input id="c-term" type="number" min="1" value="3"></div></div>
    <div class="row"><div><label>Rotating pot only: first cycle starts</label><input id="c-start" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
      <div><label>Rotating pot only: days per cycle</label><input id="c-days" type="number" min="1" value="30"></div></div>
    <p class="muted">In table banking, members can borrow up to three times their savings at 10% interest, repaid at the next meeting. The interest is shared out with the savings at the end.</p>
    <label>Members, in payout order (use the email addresses of your PayPal sandbox personal accounts)</label>
    <div id="members">${rows}</div>
    <p class="muted">The demo members come with a payment history, so you can see the AI adjust its tone.</p>
    <button class="primary" onclick="createCircle(this)">Create circle</button>
  </div>`;
}

function askCard() {
  return `<div class="card"><h2>Ask Kitty</h2>
      <div class="row"><input id="q" placeholder="Who still owes? Who has been most reliable?" onkeydown="if(event.key==='Enter')ask($('#askb'))" style="flex:4"><button id="askb" class="ai" style="flex:none" onclick="ask(this)">Ask</button></div>
      <div class="answer" id="answer" style="display:${answer ? 'block' : 'none'}">${esc(answer)}</div></div>`;
}
function resetLine() {
  return `<p class="muted"><a href="#" onclick="if(confirm('Delete this group and start again?'))run(null, async () => { await api('DELETE','/api/circle'); plan = null; answer = ''; });return false">Reset demo</a> &middot; AI: ${esc(S.ai.provider)} / ${esc(S.ai.model)}</p>`;
}
const payChip = (s) => `<div class="muted">PayPal payout ${esc(s)}</div>`;

// Table banking: members save each meeting, borrow from the fund, and share it out at the end.
function viewTable() {
  const c = S.circle, T = S.table, cy = c.cycles[c.cycles.length - 1], loans = c.loans || [];
  let top;
  if (c.shareOut) {
    const so = c.shareOut;
    top = `<div class="card"><h2>${esc(c.name)}: fund shared out</h2>
      <div class="big">${fmt(so.total)} <span class="chip ok">PayPal payout ${esc(so.status)}</span></div>
      <div class="muted">Batch ${esc(so.batchId)} &middot; ${fmt(T.fund.savings)} in savings plus ${fmt(T.fund.interest)} interest earned from loans</div>
      <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Member</th><th>Saved</th><th>Received</th></tr></thead><tbody>
      ${so.items.map((i) => `<tr><td><b>${esc(member(i.memberId).name)}</b></td><td>${fmt(T.savings[i.memberId] || 0)}</td><td>${fmt(i.amount)}</td></tr>`).join('')}</tbody></table></div>
      <div class="summary" style="margin-top:10px">${esc(so.summary || '')}</div>
      <div style="height:10px"></div><button class="small" onclick="run(this, () => api('POST','/api/payout/refresh'))">Refresh payout status</button></div>`;
  } else if (!cy) {
    top = `<div class="card"><h2>${esc(c.name)}</h2>
      <p>${c.members.length} members, each saving ${fmt(c.contribution)} per meeting. Members can borrow up to three times their savings at 10% interest, repaid at the next meeting.</p>
      <p>The fund is shared out after meeting ${c.termMeetings}.</p>
      <button class="primary" onclick="run(this, () => api('POST','/api/cycles/start'))">Start meeting 1 and send PayPal invoices</button></div>`;
  } else {
    const paid = cy.contributions.filter((x) => x.status !== 'SENT').length;
    const allIn = cy.contributions.length === c.members.length && paid === c.members.length;
    const rows = cy.contributions.map((x) => { const m = member(x.memberId); const done = x.status !== 'SENT'; return `<tr>
      <td><b>${esc(m.name)}</b><div class="muted">${fmt(T.savings[m.id] || 0)} saved &middot; ${m.onTime} on time, ${m.late} late</div></td>
      <td>${done ? `<span class="chip ok">${x.status === 'CASH' ? 'Paid in cash' : 'Paid via PayPal'}</span>` : `<span class="chip warn">Unpaid</span>${x.reminders.length ? `<div class="muted">${x.reminders.length} reminder${x.reminders.length > 1 ? 's' : ''} sent</div>` : ''}`}</td>
      <td>${x.payUrl ? `<a href="${esc(x.payUrl)}" target="_blank" rel="noopener">Invoice ${esc(x.number)}</a>` : esc(x.number)}<div class="muted">${fmt(x.amount ?? c.contribution)}${x.loanId ? ', with loan repayment' : ''}</div></td>
      <td>${done ? '' : `<button class="small" onclick="run(this, () => api('POST','/api/cycles/cash/${x.memberId}'))">Record cash</button>`}</td></tr>`; }).join('');
    top = `<div class="grid2">
      <div class="card"><div class="row tight" style="justify-content:space-between"><h2 style="margin:0">${esc(c.name)}: meeting ${cy.n}</h2>
        <button class="small" onclick="run(this, () => api('POST','/api/cycles/sync'))">Refresh from PayPal</button></div>
        <div class="tablewrap"><table><thead><tr><th>Member</th><th>Status</th><th>PayPal invoice</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
        ${cy.contributions.length < c.members.length ? `<p class="muted" style="color:var(--warn)">Only ${cy.contributions.length} of ${c.members.length} invoices were sent.</p>
        <button class="primary small" onclick="run(this, () => api('POST','/api/cycles/start'))">Send the remaining invoices</button>` : ''}
        ${allIn ? `<div class="row tight" style="margin-top:12px"><button class="primary small" onclick="run(this, async () => { await api('POST','/api/cycles/start'); plan = null; })">Start meeting ${cy.n + 1} and send PayPal invoices</button>
          ${T.shareOutBlocked ? '' : `<button class="small" onclick="shareOut(this)">Share out the fund via PayPal</button>`}</div>
          ${T.shareOutBlocked ? `<p class="muted" style="margin-bottom:0">Share-out not yet possible: ${esc(T.shareOutBlocked)}</p>` : ''}` : ''}</div>
      <div class="card"><div class="muted">Fund available to lend</div>
        <div class="big">${fmt(T.fund.cash)}</div>
        <div class="muted">${fmt(T.fund.savings)} saved &middot; ${fmt(T.fund.interest)} interest earned &middot; ${fmt(T.fund.outstanding)} out on loan</div>
        <div class="bar"><i style="width:${(paid / c.members.length) * 100}%"></i></div>
        <div class="muted">${paid} of ${c.members.length} members have paid this meeting</div>
        <div style="height:14px"></div>
        <button class="ai" style="width:100%" onclick="runAgent(this)">Ask Kitty what to do next</button>
        <div id="plan">${viewPlan()}</div></div>
    </div>`;
  }
  const status = (l) => l.status === 'requested' ? `<span class="chip warn">Requested</span>${T.loanBlocks[l.id] ? `<div class="muted">${esc(T.loanBlocks[l.id])}</div>` : ''}`
    : l.status === 'active' ? `<span class="chip warn">Out on loan</span>${payChip(l.payout?.status)}`
    : l.status === 'repaid' ? `<span class="chip ok">Repaid with interest</span>`
    : `<span class="muted">Declined</span><div class="muted">${esc(l.declineReason || '')}</div>`;
  const loanRows = loans.slice().reverse().map((l) => `<tr>
      <td><b>${esc(member(l.memberId).name)}</b><div class="muted">${esc(l.purpose)}</div></td>
      <td>${fmt(l.amount)}<div class="muted">plus ${fmt(l.interest)} interest</div></td>
      <td>${status(l)}</td>
      <td>${l.status === 'requested' ? `<div class="row tight">${T.loanBlocks[l.id] ? '' : `<button class="primary small" onclick="approveLoan(this,'${l.id}')">Approve and pay out</button>`}<button class="small" onclick="declineLoan(this,'${l.id}','')">Decline</button></div>` : ''}</td></tr>`).join('');
  const loansCard = `<div class="card"><div class="row tight" style="justify-content:space-between"><h2 style="margin:0">Loans</h2>
      <button class="small" onclick="run(this, () => api('POST','/api/payout/refresh'))">Refresh payout status</button></div>
      ${loanRows ? `<div class="tablewrap"><table><thead><tr><th>Borrower</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${loanRows}</tbody></table></div>` : '<p class="muted">No loans yet.</p>'}
      ${cy && !c.shareOut ? `<label>Record a member's loan request</label>
      <div class="row"><select id="l-member">${c.members.map((m) => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>
        <input id="l-amt" type="number" min="1" placeholder="Amount">
        <input id="l-purpose" placeholder="What is it for?" style="flex:2">
        <button style="flex:none" onclick="requestLoan(this)">Add request</button></div>` : ''}</div>`;
  return top + loansCard + askCard() + resetLine();
}

function viewCircle() {
  if (S.circle.type === 'table') return viewTable();
  const c = S.circle, cy = c.cycles[c.cycles.length - 1];
  const collecting = cy && cy.status === 'collecting';
  const pot = c.contribution * c.members.length;
  let top;
  if (!cy || !collecting) {
    const next = member(c.payoutOrder[c.cycles.length % c.members.length]);
    top = `<div class="card"><h2>${esc(c.name)}</h2>
      <p>${c.members.length} members, ${fmt(c.contribution)} each per cycle, pot of ${fmt(pot)}.</p>
      <p>Next pot goes to <b>${esc(next.name)}</b>.</p>
      <button class="primary" onclick="run(this, () => api('POST','/api/cycles/start'))">Start cycle ${c.cycles.length + 1} and send PayPal invoices</button></div>`;
  } else {
    const paid = cy.contributions.filter((x) => x.status !== 'SENT').length;
    const rows = cy.contributions.map((x) => { const m = member(x.memberId); const done = x.status !== 'SENT'; return `<tr>
      <td><b>${esc(m.name)}</b>${x.memberId === cy.recipientId ? ' <span class="chip ok">gets the pot</span>' : ''}<div class="muted">${m.onTime} on time, ${m.late} late</div></td>
      <td>${done ? `<span class="chip ok">${x.status === 'CASH' ? 'Paid in cash' : 'Paid via PayPal'}</span>` : `<span class="chip warn">Unpaid</span>${x.reminders.length ? `<div class="muted">${x.reminders.length} reminder${x.reminders.length > 1 ? 's' : ''} sent</div>` : ''}`}</td>
      <td>${x.payUrl ? `<a href="${esc(x.payUrl)}" target="_blank" rel="noopener">Invoice ${esc(x.number)}</a>` : esc(x.number)}</td>
      <td>${done ? '' : `<button class="small" onclick="run(this, () => api('POST','/api/cycles/cash/${x.memberId}'))">Record cash</button>`}</td></tr>`; }).join('');
    top = `<div class="grid2">
      <div class="card"><div class="row tight" style="justify-content:space-between"><h2 style="margin:0">${esc(c.name)}: cycle ${cy.n}</h2>
        <button class="small" onclick="run(this, () => api('POST','/api/cycles/sync'))">Refresh from PayPal</button></div>
        <div class="tablewrap"><table><thead><tr><th>Member</th><th>Status</th><th>PayPal invoice</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
        ${cy.contributions.length < c.members.length ? `<p class="muted" style="color:var(--warn)">Only ${cy.contributions.length} of ${c.members.length} invoices were sent. The pot cannot be paid out until every member has one.</p>
        <button class="primary small" onclick="run(this, () => api('POST','/api/cycles/start'))">Send the remaining invoices</button>` : ''}</div>
      <div class="card"><div class="muted">Pot for ${esc(member(cy.recipientId).name)}</div>
        <div class="big">${fmt(paid * c.contribution)} <span class="muted">of ${fmt(pot)}</span></div>
        <div class="bar"><i style="width:${(paid / c.members.length) * 100}%"></i></div>
        <div class="muted">${paid} of ${c.members.length} members have paid</div>
        ${cy.failedPayouts?.length ? `<p class="muted" style="color:var(--bad)">PayPal did not complete the last payout (batch ${esc(cy.failedPayouts[cy.failedPayouts.length - 1].batchId)}: ${esc(cy.failedPayouts[cy.failedPayouts.length - 1].status)}). No money moved. Ask Kitty to try again.</p>` : ''}
        <div style="height:14px"></div>
        <button class="ai" style="width:100%" onclick="runAgent(this)">Ask Kitty what to do next</button>
        <div id="plan">${viewPlan()}</div></div>
    </div>`;
  }
  const history = c.cycles.filter((x) => x.status === 'paid_out').reverse().map((x) => `<div style="padding:10px 0;border-top:1px solid var(--line)">
      <b>Cycle ${x.n}</b>: ${fmt(x.payout.amount)} paid to ${esc(member(x.recipientId).name)} <span class="chip ok">PayPal payout ${esc(x.payout.status)}</span>
      <div class="muted">Batch ${esc(x.payout.batchId)}</div><div class="summary">${esc(x.summary || '')}</div></div>`).join('');
  return top + scheduleCard() + askCard() + `
    <div class="card"><div class="row tight" style="justify-content:space-between"><h2 style="margin:0">Payout history</h2>
      <button class="small" onclick="run(this, () => api('POST','/api/payout/refresh'))">Refresh payout status</button></div>
      ${history || '<p class="muted">No pots paid out yet.</p>'}</div>` + resetLine();
}

function viewPlan() {
  if (!plan) return '<p class="muted">Kitty reviews who has paid and proposes reminders or the payout. Nothing is sent until you approve it.</p>';
  const acts = plan.actions.map((a, i) => a.type === 'remind' ? `<div class="action"><h3>Remind ${esc(member(a.memberId)?.name)} <span class="chip warn">${esc(a.tone || 'gentle')}</span></h3>
      <div class="muted">${esc(a.reason)}</div>
      <input id="sub${i}" value="${esc(a.subject)}" aria-label="Subject" style="margin-top:6px"><textarea id="note${i}" aria-label="Message">${esc(a.note)}</textarea>
      <div class="row tight" style="margin-top:8px"><button class="primary small" onclick="approveRemind(this, ${i})">Approve and send via PayPal</button><button class="small" onclick="dismiss(${i})">Dismiss</button></div></div>`
    : a.type === 'loan_decision' ? loanAction(a, i)
    : a.type === 'share_out' ? `<div class="action"><h3>Share out the fund</h3><div class="muted">${esc(a.reason)}</div>
      <div class="row tight" style="margin-top:8px"><button class="primary small" onclick="shareOut(this)">Approve PayPal share-out</button><button class="small" onclick="dismiss(${i})">Dismiss</button></div></div>`
    : `<div class="action"><h3>Pay out the pot</h3><div class="muted">${esc(a.reason)}</div>
      <div class="row tight" style="margin-top:8px"><button class="primary small" onclick="approvePayout(this)">Approve PayPal payout</button><button class="small" onclick="dismiss(${i})">Dismiss</button></div></div>`).join('');
  return `<p style="margin:12px 0 0">${esc(plan.briefing)}</p>${acts || '<p class="muted">Nothing to do right now.</p>'}`;
}

function loanAction(a, i) {
  const l = (S.circle.loans || []).find((l) => l.id === a.loanId && l.status === 'requested');
  if (!l) return '';
  const yes = a.decision === 'approve';
  return `<div class="action"><h3>Loan request: ${esc(member(l.memberId).name)}, ${fmt(l.amount)} <span class="chip ${yes ? 'ok' : 'warn'}">Kitty says ${yes ? 'approve' : 'decline'}</span></h3>
      <div class="muted">${esc(a.reason)}</div>
      <div class="row tight" style="margin-top:8px">${yes ? `<button class="primary small" onclick="approveLoan(this,'${l.id}')">Approve and pay out via PayPal</button>` : ''}
      <button class="small" onclick="declineLoan(this,'${l.id}', plan.actions[${i}].reason)">Decline loan</button><button class="small" onclick="dismiss(${i})">Dismiss</button></div></div>`;
}
const dropLoan = (id) => { if (plan) plan.actions = plan.actions.filter((a) => !(a.type === 'loan_decision' && a.loanId === id)); if (plan && !plan.actions.length) plan = null; };
async function requestLoan(btn) {
  const body = { memberId: $('#l-member').value, amount: Number($('#l-amt').value), purpose: $('#l-purpose').value.trim() };
  await run(btn, () => api('POST', '/api/loans', body));
}
async function approveLoan(btn, id) { await run(btn, async () => { await api('POST', `/api/loans/${id}/approve`); dropLoan(id); }); }
async function declineLoan(btn, id, reason) { await run(btn, async () => { await api('POST', `/api/loans/${id}/decline`, { reason }); dropLoan(id); }); }
async function shareOut(btn) { await run(btn, async () => { await api('POST', '/api/shareout'); plan = null; }); }
async function createCircle(btn) {
  const members = [...document.querySelectorAll('#members .row')].map((r) => ({ name: $('.m-name', r).value.trim(), email: $('.m-email', r).value.trim(), onTime: $('.m-on', r).value, late: $('.m-late', r).value })).filter((m) => m.name || m.email);
  await run(btn, () => api('POST', '/api/circle', { name: $('#c-name').value.trim(), contribution: Number($('#c-amt').value), type: $('#c-type').value, termMeetings: Number($('#c-term').value), startDate: $('#c-start').value, cycleDays: Number($('#c-days').value), members }));
}
async function runAgent(btn) { await run(btn, async () => { plan = null; plan = await api('POST', '/api/agent/run'); }); }
async function approveRemind(btn, i) { const a = plan.actions[i]; await run(btn, async () => { await api('POST', '/api/actions/remind', { memberId: a.memberId, subject: $('#sub' + i).value, note: $('#note' + i).value }); plan.actions.splice(i, 1); }); }
async function approvePayout(btn) { await run(btn, async () => { await api('POST', '/api/actions/payout'); plan = null; }); }
function dismiss(i) { plan.actions.splice(i, 1); render(); }
async function ask(btn) { const question = $('#q').value; await run(btn, async () => { answer = (await api('POST', '/api/ask', { question })).answer; }); }
load().catch((e) => showErr(e.message));
</script>
<script type="module">
// Rotation schedule panel, built with Bryntum Scheduler. The page script above calls window.mountSchedule() after every render.
import { Scheduler } from '/vendor/bryntum/scheduler.module.js';

let scheduler = null;
const day = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const shortDate = (d) => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

window.mountSchedule = () => {
  if (scheduler) { scheduler.destroy(); scheduler = null; }
  const el = document.querySelector('#sched'), sc = S && S.schedule;
  if (!el || !sc) return;
  const c = S.circle, pot = c.contribution * c.members.length;
  const t0 = day(sc.startDate).getTime(), span = sc.cycleDays * 86400000;
  const cycleAt = (date) => sc.cycles[Math.round((date.getTime() - t0) / span)];

  // What each event means is kept here, keyed by event id, rather than on the Bryntum records.
  const meta = new Map(), events = [];
  for (const x of sc.cycles) {
    const cy = c.cycles[x.n - 1];
    for (const m of c.members) {
      const con = cy && cy.contributions.find((k) => k.memberId === m.id);
      const state = con ? con.status : 'upcoming';
      const label = { PAID: 'Paid via PayPal', CASH: 'Paid in cash', SENT: 'Unpaid', upcoming: 'Upcoming' }[state];
      const id = `c-${x.n}-${m.id}`;
      events.push({ id, resourceId: m.id, startDate: day(x.start), endDate: day(x.end), name: `${fmt(c.contribution)} · ${label}`,
        eventColor: SCHED[state], draggable: false, resizable: false, cls: con && con.payUrl ? 'k-link' : '' });
      meta.set(id, { kind: 'contribution', payUrl: con && con.payUrl });
    }
    const paidOut = x.status === 'paid_out', id = `p-${x.n}`;
    events.push({ id, resourceId: x.recipientId, startDate: day(x.start), endDate: day(x.end),
      name: paidOut ? `Received ${fmt(pot)} · PayPal batch ${x.batchId}` : `Receives the pot: ${fmt(pot)}`,
      eventColor: SCHED.pot, iconCls: 'fa-solid fa-sack-dollar', draggable: !x.started, resizable: false });
    meta.set(id, { kind: 'pot', position: x.position, started: x.started });
  }

  // Where a dragged turn would land, and whether that is allowed. The server checks again on drop.
  const landing = (record, startDate, resourceId) => {
    const from = meta.get(record.id), to = cycleAt(startDate);
    if (!from || from.kind !== 'pot' || from.started) return { message: 'Only future turns can be moved' };
    if (!to) return { message: 'That is outside this rotation' };
    if (to.started) return { message: `Cycle ${to.n} has already started` };
    const rowChanged = resourceId !== sc.cycles[from.position].recipientId, cycleChanged = to.position !== from.position;
    if (rowChanged && cycleChanged) return { message: 'Move along the row to change the cycle, or straight up or down to give this turn to another member' };
    if (!rowChanged && !cycleChanged) return { same: true };
    // Either way it is a swap of two positions in the payout order.
    const other = rowChanged ? c.payoutOrder.indexOf(resourceId) : to.position;
    if (sc.cycles[other].started) return { message: `${member(resourceId).name} has already had a turn in this rotation` };
    const order = c.payoutOrder.slice();
    [order[from.position], order[other]] = [order[other], order[from.position]];
    return { order };
  };

  scheduler = new Scheduler({
    appendTo: el,
    autoHeight: true,
    startDate: day(sc.startDate),
    endDate: day(sc.endDate),
    viewPreset: {
      tickWidth: 150,
      timeResolution: { unit: 'day', increment: 1 },
      headers: [{ unit: 'day', increment: sc.cycleDays, align: 'center',
        renderer: (start, end, cfg, i) => (sc.cycles[i] ? `Cycle ${sc.cycles[i].n} · from ${shortDate(start)}` : '') }],
    },
    forceFit: el.clientWidth >= 760, // on a phone the timeline scrolls inside the panel instead of squeezing
    rowHeight: 46,
    barMargin: 5,
    eventLayout: 'stack',
    zoomOnMouseWheel: false,
    zoomOnTimeAxisDoubleClick: false,
    enableEventAnimations: false,
    columns: [{ text: 'Member', field: 'name', width: el.clientWidth >= 760 ? 150 : 110, sortable: false, draggable: false }],
    resources: c.members.map((m) => ({ id: m.id, name: m.name })),
    events,
    features: {
      eventDrag: {
        constrainDragToTimeSlot: false,
        validatorFn({ startDate, eventRecords, newResource }) {
          const r = landing(eventRecords[0], startDate, newResource.id);
          return r.message ? { valid: false, message: r.message } : true;
        },
      },
      eventResize: false, eventEdit: false, eventDragCreate: false, eventMenu: false, scheduleMenu: false,
      timeAxisHeaderMenu: false, cellEdit: false, cellMenu: false, headerMenu: false, eventTooltip: false, sort: false,
    },
    listeners: {
      eventClick({ eventRecord }) {
        const m = meta.get(eventRecord.id);
        if (m && m.payUrl) window.open(m.payUrl, '_blank', 'noopener');
      },
      async eventDrop({ eventRecords, context }) {
        const rec = eventRecords[0];
        const r = landing(rec, rec.startDate, context && context.newResource ? context.newResource.id : rec.resourceId);
        showErr(r.message || '');
        if (r.order) { try { await api('PUT', '/api/circle/order', { payoutOrder: r.order }); } catch (e) { showErr(e.message); } }
        await load(); // redraws from the server's state, which also undoes a rejected drag
      },
    },
  });
};
window.mountSchedule();
</script>
